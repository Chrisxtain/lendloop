<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Loan lifecycle</title>
  <desc>A loan starts as requested. The lender approves or declines it, or the borrower cancels it. An approved loan becomes returned when the lender marks it returned, or cancelled if an admin removes the listing.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; fill: #18181b; }
      .edge { fill: none; stroke: #52525b; stroke-width: 1.6; }
      .lbl { font-size: 12px; fill: #3f3f46; paint-order: stroke; stroke: #fafafa; stroke-width: 5px; stroke-linejoin: round; }
      .who { font-weight: 600; }
      .note { font-size: 12px; fill: #52525b; }
    </style>
  </defs>

  <rect x="1" y="1" width="758" height="328" rx="16" fill="#fafafa" stroke="#e4e4e7"/>

  <!-- start -->
  <circle cx="34" cy="84" r="7" fill="#18181b"/>
  <path class="edge" d="M41,84 L66,84" marker-end="url(#a)"/>

  <!-- states -->
  <rect x="70" y="60" width="150" height="48" rx="24" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="145" y="89" text-anchor="middle" fill="#92400e">requested</text>

  <rect x="320" y="60" width="150" height="48" rx="24" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/>
  <text class="t" x="395" y="89" text-anchor="middle">approved</text>

  <rect x="570" y="60" width="150" height="48" rx="24" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text class="t" x="645" y="89" text-anchor="middle" fill="#166534">returned</text>

  <rect x="70" y="210" width="150" height="48" rx="24" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text class="t" x="145" y="239" text-anchor="middle" fill="#52525b">declined</text>

  <rect x="320" y="210" width="150" height="48" rx="24" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text class="t" x="395" y="239" text-anchor="middle" fill="#52525b">cancelled</text>

  <!-- transitions -->
  <path class="edge" d="M220,84 L316,84" marker-end="url(#a)"/>
  <text class="lbl" x="268" y="72" text-anchor="middle"><tspan class="who">lender</tspan> approves</text>

  <path class="edge" d="M470,84 L566,84" marker-end="url(#a)"/>
  <text class="lbl" x="518" y="66" text-anchor="middle"><tspan class="who">lender</tspan> marks</text>
  <text class="lbl" x="518" y="80" text-anchor="middle" dy="-1">returned</text>

  <path class="edge" d="M145,108 L145,206" marker-end="url(#a)"/>
  <text class="lbl" x="152" y="162"><tspan class="who">lender</tspan> declines</text>

  <path class="edge" d="M205,105 C260,150 300,170 340,207" marker-end="url(#a)"/>
  <text class="lbl" x="262" y="132"><tspan class="who">borrower</tspan> cancels</text>

  <path class="edge" d="M395,108 L395,206" marker-end="url(#a)"/>
  <text class="lbl" x="402" y="155"><tspan class="who">admin</tspan> removes</text>
  <text class="lbl" x="402" y="170">the listing</text>

  <text class="note" x="34" y="296">Each step is allowed only for the person named and only from the state shown, and triggers exactly one email.</text>
</svg>
