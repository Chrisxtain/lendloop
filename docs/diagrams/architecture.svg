<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>LendLoop architecture</title>
  <desc>The browser signs in with Clerk and calls Convex with a Clerk JWT. Convex sends a signed webhook to the n8n Request notification workflow. n8n workflows call Convex over signed HTTP endpoints for the overdue list, write-backs and error reports, and send email through Resend. Failed runs go to the n8n Error handler.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 600; fill: #18181b; }
      .sub { font-size: 12px; fill: #52525b; }
      .edge { fill: none; stroke: #52525b; stroke-width: 1.6; }
      .signed { fill: none; stroke: #15803d; stroke-width: 1.8; }
      .dashed { fill: none; stroke: #a1a1aa; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .label { font-size: 12px; fill: #3f3f46; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .labelAccent { font-size: 12px; fill: #15803d; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- canvas (white so it reads in GitHub light and dark mode) -->
  <rect x="1" y="1" width="958" height="448" rx="16" fill="#fafafa" stroke="#e4e4e7"/>

  <!-- Browser -->
  <rect class="box" x="30" y="175" width="170" height="90" rx="12"/>
  <text class="title" x="115" y="210" text-anchor="middle">Browser</text>
  <text class="sub" x="115" y="230" text-anchor="middle">Next.js app</text>
  <text class="sub" x="115" y="247" text-anchor="middle">hosted on Vercel</text>

  <!-- Clerk -->
  <rect class="box" x="300" y="40" width="200" height="74" rx="12"/>
  <text class="title" x="400" y="72" text-anchor="middle">Clerk</text>
  <text class="sub" x="400" y="92" text-anchor="middle">sign-in, issues the JWT</text>

  <!-- Convex -->
  <rect x="300" y="165" width="200" height="140" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text class="title" x="400" y="198" text-anchor="middle">Convex</text>
  <text class="sub" x="400" y="220" text-anchor="middle">database + every rule</text>
  <text class="sub" x="400" y="242" text-anchor="middle">permission guards</text>
  <text class="sub" x="400" y="260" text-anchor="middle">input validation</text>
  <text class="sub" x="400" y="278" text-anchor="middle">signed HTTP endpoints</text>

  <!-- n8n container -->
  <rect x="580" y="28" width="210" height="392" rx="14" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="title" x="685" y="54" text-anchor="middle">n8n</text>

  <rect class="box" x="600" y="72" width="170" height="72" rx="10"/>
  <text class="title" x="685" y="102" text-anchor="middle" font-size="14">Request notification</text>
  <text class="sub" x="685" y="122" text-anchor="middle">on every loan change</text>

  <rect class="box" x="600" y="180" width="170" height="72" rx="10"/>
  <text class="title" x="685" y="210" text-anchor="middle" font-size="14">Overdue reminders</text>
  <text class="sub" x="685" y="230" text-anchor="middle">daily at 09:00 UTC</text>

  <rect class="box" x="600" y="330" width="170" height="68" rx="10"/>
  <text class="title" x="685" y="359" text-anchor="middle" font-size="14">Error handler</text>
  <text class="sub" x="685" y="379" text-anchor="middle">reports failed runs</text>

  <!-- Resend -->
  <rect class="box" x="830" y="140" width="110" height="80" rx="12"/>
  <text class="title" x="885" y="175" text-anchor="middle">Resend</text>
  <text class="sub" x="885" y="195" text-anchor="middle">email delivery</text>

  <!-- Browser -> Clerk -->
  <path class="edge" d="M200,195 C250,195 250,77 296,77" marker-end="url(#arrow)"/>
  <text class="label" x="232" y="128" text-anchor="middle">sign in</text>

  <!-- Browser -> Convex -->
  <path class="edge" d="M200,235 L296,235" marker-end="url(#arrow)"/>
  <text class="label" x="249" y="226" text-anchor="middle">calls + JWT</text>

  <!-- Convex -> Request notification (signed webhook) -->
  <path class="signed" d="M500,190 C545,190 550,108 596,108" marker-end="url(#arrowAccent)"/>
  <text class="labelAccent" x="540" y="140" text-anchor="middle">signed</text>
  <text class="labelAccent" x="540" y="155" text-anchor="middle">webhook</text>

  <!-- Overdue reminders -> Convex (signed calls) -->
  <path class="signed" d="M600,216 C555,216 550,240 504,240" marker-end="url(#arrowAccent)"/>
  <text class="labelAccent" x="552" y="262" text-anchor="middle">signed calls</text>

  <!-- Request notification -> Convex write-back -->
  <path class="signed" d="M640,144 C640,165 560,205 504,212" marker-end="url(#arrowAccent)"/>

  <!-- Error handler -> Convex -->
  <path class="signed" d="M600,364 C540,364 540,290 504,290" marker-end="url(#arrowAccent)"/>
  <text class="labelAccent" x="548" y="335" text-anchor="middle">error</text>
  <text class="labelAccent" x="548" y="350" text-anchor="middle">reports</text>

  <!-- Workflows -> Resend -->
  <path class="edge" d="M770,108 C800,108 800,165 826,165" marker-end="url(#arrow)"/>
  <path class="edge" d="M770,216 C800,216 800,195 826,195" marker-end="url(#arrow)"/>
  <text class="label" x="805" y="130" text-anchor="middle">email</text>

  <!-- on failure -->
  <path class="dashed" d="M685,252 L685,326" marker-end="url(#arrow)"/>
  <text class="label" x="685" y="295" text-anchor="middle">on failure</text>

  <!-- legend -->
  <line x1="30" y1="400" x2="62" y2="400" stroke="#15803d" stroke-width="1.8"/>
  <text class="sub" x="70" y="404">HMAC-signed, timestamped (5-min replay window), idempotent write-backs</text>
  <line x1="30" y1="424" x2="62" y2="424" stroke="#52525b" stroke-width="1.6"/>
  <text class="sub" x="70" y="428">authenticated (Clerk JWT) or API key held in n8n's encrypted credential store</text>
</svg>
